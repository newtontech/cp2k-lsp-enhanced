schema: scientific-lsp-skill/v1
name: cp2k
software: cp2k
display_name: CP2K
description: CP2K input preflight for generated .inp files and runtime logs.
package:
  name: cp2k-lsp-enhanced
  install: pip install cp2k-lsp-enhanced
entrypoints:
  server: cp2k-language-server
  tool: cp2k-lsp-tool
file_patterns:
  - *.inp
operations:
  - capabilities
  - check
  - context
  - complete
  - hover
  - symbols
  - fix
diagnostic_contract: DiagnosticEnvelope/v1
blocking_policy:
  mode: fail-on-blocking
  description: Use --fail-on-blocking when generated inputs must be launch-ready.
source_provenance:
  -
    kind: official_docs
    label: CP2K executable/version-matched manual generation
    url: https://www.cp2k.org/input_file
  -
    kind: official_docs
    label: CP2K latest input reference
    url: https://manual.cp2k.org/trunk/CP2K_INPUT.html
